name: Keep Render Alive

on:
  schedule:
    - cron: '*/4 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" https://ag-erp-backend-dev.onrender.com/health)
          echo "Health check responded with status: $response"
          if [ "$response" -ne 200 ]; then
            echo "Health check failed"
            exit 1
          fi
