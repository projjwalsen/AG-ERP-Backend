version: "3.9"

services:

  postgres:
    image: postgres:17
    container_name: ag-erp-postgres

    restart: unless-stopped

    env_file:
      - .env

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5


  backend:

    build:
      context: .
      dockerfile: Dockerfile

    container_name: ag-erp-backend

    restart: unless-stopped

    depends_on:

      postgres:
        condition: service_healthy

    env_file:
      - .env

    ports:
      - "5100:5100"

    volumes:

      - ./uploads:/app/uploads

      - ./logs:/app/logs

volumes:

  postgres_data: